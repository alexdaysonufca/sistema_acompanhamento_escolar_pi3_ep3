<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Swagger UI — TrAcEs API RESTful</title>
  <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/swagger-ui-dist@5/swagger-ui.css">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎓</text></svg>">
  <style>
    body {
      margin: 0;
      padding: 0;
      background: #fafafa;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    .swagger-ui .topbar {
      background-color: #1B4F8A;
      box-shadow: 0 2px 8px rgba(0,0,0,0.15);
    }
    .custom-header {
      background: linear-gradient(135deg, #1B4F8A 0%, #0F3B6C 100%);
      color: white;
      padding: 24px;
      text-align: center;
      border-bottom: 3px solid #FEF08A;
    }
    .custom-header h1 {
      margin: 0 0 8px 0;
      font-size: 1.8rem;
    }
    .custom-header p {
      margin: 0;
      opacity: 0.9;
      font-size: 0.95rem;
    }
    .badge {
      display: inline-block;
      background: #FEF08A;
      color: #1A2332;
      font-weight: bold;
      padding: 2px 8px;
      border-radius: 12px;
      font-size: 0.75rem;
      margin-left: 8px;
      text-transform: uppercase;
    }
  </style>
</head>
<body>
  <header class="custom-header">
    <h1>TrAcEs — Documentação Interativa da API <span class="badge">Swagger UI / OpenAPI 3.0</span></h1>
    <p>Trilha de Acompanhamento Estudantil · Clean Architecture + Python 3.10+ + SQLite 3 + React 18</p>
  </header>

  <div id="swagger-ui"></div>

  <script src="https://cdn.jsdelivr.net/npm/swagger-ui-dist@5/swagger-ui-bundle.js" crossorigin></script>
  <script src="https://cdn.jsdelivr.net/npm/swagger-ui-dist@5/swagger-ui-standalone-preset.js" crossorigin></script>
  <script>
    window.onload = function() {
      window.ui = SwaggerUIBundle({
        url: "http://127.0.0.1:8000/openapi.json",
        dom_id: '#swagger-ui',
        deepLinking: true,
        presets: [
          SwaggerUIBundle.presets.apis,
          SwaggerUIStandalonePreset
        ],
        plugins: [
          SwaggerUIBundle.plugins.DownloadUrl
        ],
        layout: "BaseLayout",
        defaultModelsExpandDepth: 1,
        defaultModelExpandDepth: 1,
        docExpansion: "list",
        filter: true,
        showExtensions: true,
        showCommonExtensions: true,
        supportedSubmitMethods: ["get", "post", "put", "delete", "options"]
      });
    };
  </script>
</body>
</html>
