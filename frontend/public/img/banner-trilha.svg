<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" width="100%" height="auto" role="img" aria-label="Banner Trilha de Acompanhamento Escolar">
  <defs>
    <linearGradient id="bg-banner" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="50%" stop-color="#1E3A8A"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>
    <linearGradient id="card-glass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.05"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="300" rx="20" fill="url(#bg-banner)"/>
  
  <!-- Decorative Grid Lines -->
  <path d="M 0 100 Q 200 60, 400 120 T 800 80" stroke="#60A5FA" stroke-opacity="0.2" stroke-width="2" fill="none"/>
  <path d="M 0 200 Q 300 240, 600 180 T 800 220" stroke="#F59E0B" stroke-opacity="0.2" stroke-width="2" fill="none"/>

  <!-- Left Content Box -->
  <rect x="40" y="40" width="420" height="220" rx="16" fill="url(#card-glass)" stroke="#FFFFFF" stroke-opacity="0.2"/>
  <text x="70" y="90" font-family="system-ui, sans-serif" font-weight="800" font-size="28" fill="#FFFFFF">TrAcEs — Acompanhamento</text>
  <text x="70" y="120" font-family="system-ui, sans-serif" font-weight="800" font-size="28" fill="#F59E0B">Escolar Integrado</text>
  <text x="70" y="160" font-family="system-ui, sans-serif" font-size="14" fill="#E2E8F0" width="360">
    <tspan x="70" dy="0">Conectando famílias, professores e estudantes para</tspan>
    <tspan x="70" dy="22">uma jornada pedagógica transparente e acessível.</tspan>
  </text>
  <rect x="70" y="200" width="160" height="36" rx="18" fill="#F59E0B"/>
  <text x="150" y="223" font-family="system-ui, sans-serif" font-weight="700" font-size="13" fill="#0F172A" text-anchor="middle">Painel Acadêmico</text>

  <!-- Right Visual Elements -->
  <rect x="500" y="50" width="250" height="200" rx="16" fill="url(#card-glass)" stroke="#FFFFFF" stroke-opacity="0.25"/>
  <!-- Progress Bars Graphic -->
  <text x="530" y="90" font-family="system-ui, sans-serif" font-weight="700" font-size="15" fill="#FFFFFF">Desempenho Geral</text>
  
  <text x="530" y="120" font-family="system-ui, sans-serif" font-size="12" fill="#94A3B8">Matemática (9.5)</text>
  <rect x="530" y="128" width="190" height="8" rx="4" fill="#334155"/>
  <rect x="530" y="128" width="180" height="8" rx="4" fill="#10B981"/>

  <text x="530" y="158" font-family="system-ui, sans-serif" font-size="12" fill="#94A3B8">Português (9.0)</text>
  <rect x="530" y="166" width="190" height="8" rx="4" fill="#334155"/>
  <rect x="530" y="166" width="171" height="8" rx="4" fill="#3B82F6"/>

  <text x="530" y="196" font-family="system-ui, sans-serif" font-size="12" fill="#94A3B8">Frequência (96%)</text>
  <rect x="530" y="204" width="190" height="8" rx="4" fill="#334155"/>
  <rect x="530" y="204" width="182" height="8" rx="4" fill="#F59E0B"/>
</svg>
